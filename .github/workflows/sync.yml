name: Sync ForexFactory calendar

on:
  schedule:
    - cron: "0 12 * * 0"   # Sundays 12:00 UTC (5:00 AM Phoenix)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build calendar
        run: python ff_to_ics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add usd-high-impact.ics
          git diff --cached --quiet || (git commit -m "Update calendar" && git push)
